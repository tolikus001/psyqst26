  <!-- Notibot Bridge Early Interceptor -->
  <script>
    window.notibotInitData = null;
    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'NOTIBOT_INIT' && event.data.data) {
        window.notibotInitData = event.data.data;
      }
    });
  </script>
  <!-- Fallback Inlined Notibot Bridge if standalone -->
  <script>
    if (!window.notibot) {
      (function() {
        class NotibotBridge {
          constructor() {
            this.user = {};
            this.app = {};
            this._updateHandlers = [];
            this._lastActionTimes = {};
            this._responseHandlers = {};
            this._init();
          }
          _init() {
            window.addEventListener('message', (event) => {
              if (!event.data) return;
              const isInit = event.data.type === 'NOTIBOT_INIT' ||
                             event.data.type === 'notibot:init' ||
                             event.data.type === 'NOTIBOT_READY' ||
                             event.data.type === 'notibot_init';
              if (isInit) {
                const u = (event.data.data && event.data.data.user) || event.data.user || (event.data.data && event.data.data.displayName ? event.data.data : null);
                const a = (event.data.data && event.data.data.app) || event.data.app || {};
                if (u) this.user = u;
                if (a) this.app = a;
                this._updateHandlers.forEach(cb => {
                  try { cb(this.user, this.app); } catch(e) {}
                });
              }
            });
            if (window.parent && window.parent !== window) {
              try { window.parent.postMessage({ source: 'vibe-sandbox', type: 'READY_FOR_INIT' }, '*'); } catch(e) {}
            }
          }
          onUpdate(callback) {
            if (typeof callback === 'function') {
              this._updateHandlers.push(callback);
              if (this.user && (this.user.displayName || this.user.first_name || this.user.id || Object.keys(this.user).length > 0)) {
                callback(this.user, this.app);
              }
            }
          }
          openLink(url) { if (window.parent) window.parent.postMessage({ source: 'vibe-sandbox', type: 'open_link', payload: { url } }, '*'); else window.location.href = url; }
          hapticSelection() { if (window.parent) window.parent.postMessage({ source: 'vibe-sandbox', type: 'haptic', payload: { style: 'selection' } }, '*'); }
          hapticImpact(style) { if (window.parent) window.parent.postMessage({ source: 'vibe-sandbox', type: 'haptic', payload: { style } }, '*'); }
        }
        window.notibot = new NotibotBridge();
      })();
    }
  </script>

  <title>Анатолий Фёдоров — Простые вещи в отношениях</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --nb-bg: #EAE6DF;
      --nb-cream: #FBF8F3;
      --nb-text: #202D35;
      --nb-text-2: #5D6B73;
      --nb-accent: #124453;
      --nb-accent-hover: #0E3541;
      --nb-gold: #C29E65;
      --nb-gold-light: #F0E3CC;
      --nb-gold-dark: #8C6A32;
      --nb-card-border: rgba(194, 158, 101, 0.28);
      --nb-shadow: 0 10px 24px rgba(22, 36, 45, 0.08);
      --font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #EAE6DF;
      color: var(--nb-text);
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
    }

    .page-container {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
      padding: 12px 14px 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Top Banner Card */
    .banner-card {
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.09);
      background: #FFF;
      position: relative;
    }

    .banner-card img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* Info Benefits Card */
    .benefits-card {
      background: var(--nb-cream);
      border: 1px solid rgba(194, 158, 101, 0.35);
      border-radius: 20px;
      padding: 20px 18px;
      box-shadow: var(--nb-shadow);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .benefits-title {
      font-size: 16px;
      font-weight: 800;
      color: #273740;
      margin: 0;
      letter-spacing: -0.2px;
    }

    .benefits-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .benefit-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .benefit-icon {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--nb-gold);
    }

    .benefit-icon svg {
      width: 30px;
      height: 30px;
      stroke: #B89255;
      stroke-width: 1.5;
      fill: none;
    }

    .benefit-text {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.35;
      color: #43545E;
      text-align: center;
      max-width: 280px;
    }

    /* Gold Diagnostic Button */
    .diagnostic-btn {
      width: 100%;
      min-height: 44px;
      padding: 10px 16px;
      background: linear-gradient(180deg, #F9F4EC 0%, #EDE1CD 100%);
      border: 1.5px solid #C8AA74;
      border-radius: 14px;
      font-size: 13.5px;
      font-weight: 700;
      color: #634718;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(175, 140, 80, 0.14);
      transition: all 0.2s ease;
    }

    .diagnostic-btn:active {
      transform: scale(0.985);
      background: #E6D8C2;
    }

    /* 2x2 Grid of Main Buttons */
    .grid-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .product-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .product-card:active {
      transform: scale(0.97);
    }

    .product-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Bottom Channels Buttons */
    .action-btn {
      width: 100%;
      min-height: 48px;
      background: var(--nb-accent);
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 6px 18px rgba(18, 68, 83, 0.18);
      transition: all 0.2s ease;
    }

    .action-btn:active {
      transform: scale(0.985);
      background: var(--nb-accent-hover);
    }

    /* Footer Links */
    .footer-links {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 6px 6px;
      font-size: 11px;
      color: var(--nb-text-2);
      text-align: center;
    }

    .footer-links a, .footer-links button {
      background: none;
      border: none;
      padding: 0;
      font-size: 11px;
      color: #6C7C85;
      text-decoration: none;
      cursor: pointer;
    }

    .footer-links a:hover, .footer-links button:hover {
      text-decoration: underline;
    }

    .footer-dot {
      opacity: 0.5;
    }

    /* Modal / Drawer for Legal Info */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-content {
      background: #FFFFFF;
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 22px 20px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      color: var(--nb-text);
    }

    .modal-close-btn {
      background: rgba(0, 0, 0, 0.06);
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 16px;
      font-weight: 700;
      color: #444;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

        content: '<p><strong>Московская Академия гипноза и гипнотерапии (МАГиГ)</strong></p><p>Анатолий Фёдоров является проректором Академии и ведущим преподавателем курсов профессиональной переподготовки по классическому и эриксоновскому гипнозу, системной терапии и консультированию.</p><p>По вопросам сертификационных программ и наборов в группы напишите напрямую Анатолию:</p><p style="margin-top:14px;"><a href="https://t.me/luck_master" target="_blank" class="action-btn" style="text-decoration:none; display:flex; align-items:center; justify-content:center;"><span>Написать в Telegram @luck_master</span></a></p>'

      document.getElementById('legalModal').style.display = 'flex';

    function hideModal() {
      document.getElementById('legalModal').style.display = 'none';
    }

    function closeModal(e) {
      if (e.target.id === 'legalModal') {

      }
